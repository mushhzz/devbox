---
- name: Install RPM Fusion free and nonfree repos
  become: true
  ansible.builtin.dnf:
    name:
      - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_distribution_major_version }}.noarch.rpm"
      - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_distribution_major_version }}.noarch.rpm"
    state: present
    disable_gpg_check: true
  ignore_errors: true

- name: Update all packages
  become: true
  ansible.builtin.dnf:
    name: "*"
    state: latest
  when: run_system_update

- name: Install build essentials and core tools
  become: true
  ansible.builtin.dnf:
    name:
      - "@development-tools"
      - gcc
      - gcc-c++
      - make
      - cmake
      - automake
      - autoconf
      - openssl-devel
      - pkg-config
      - unzip
      - curl
      - wget
      - xz
      - tar
      - bzip2
    state: present
