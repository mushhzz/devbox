---
# --- macOS ---
- name: Install Homebrew
  ansible.builtin.shell: >
    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  args:
    creates: /opt/homebrew/bin/brew
  when: ansible_os_family == "Darwin"

- name: Add Homebrew to PATH (Apple Silicon)
  ansible.builtin.shell: >
    echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> {{ target_user_home }}/.zprofile
  args:
    creates: "{{ target_user_home }}/.zprofile"
  when: ansible_os_family == "Darwin" and ansible_architecture == "arm64"

- name: Update all packages (macOS)
  become: false
  community.general.homebrew:
    update_homebrew: true
    upgrade_all: true
  when: ansible_os_family == "Darwin" and run_system_update

- name: Install build essentials (macOS)
  become: false
  community.general.homebrew:
    name:
      - cmake
      - automake
      - autoconf
      - openssl@3
      - pkg-config
      - curl
      - wget
      - xz
    state: present
  when: ansible_os_family == "Darwin"

- name: Ensure Xcode Command Line Tools are installed
  ansible.builtin.command: xcode-select --install
  register: xcode_result
  changed_when: "'already installed' not in xcode_result.stderr"
  failed_when: false
  when: ansible_os_family == "Darwin"

# --- Fedora ---
- name: Install RPM Fusion free and nonfree repos
  become: true
  ansible.builtin.dnf:
    name:
      - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_distribution_major_version }}.noarch.rpm"
      - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_distribution_major_version }}.noarch.rpm"
    state: present
    disable_gpg_check: true
  ignore_errors: true
  when: ansible_os_family == "RedHat"

- name: Update all packages (Fedora)
  become: true
  ansible.builtin.dnf:
    name: "*"
    state: latest
  when: ansible_os_family == "RedHat" and run_system_update

- name: Install build essentials (Fedora)
  become: true
  ansible.builtin.dnf:
    name:
      - "@development-tools"
      - gcc
      - gcc-c++
      - make
      - cmake
      - automake
      - autoconf
      - openssl-devel
      - pkg-config
      - unzip
      - curl
      - wget
      - xz
      - tar
      - bzip2
    state: present
  when: ansible_os_family == "RedHat"

# --- Ubuntu/Debian ---
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Update all packages (Ubuntu)
  become: true
  ansible.builtin.apt:
    upgrade: dist
  when: ansible_os_family == "Debian" and run_system_update

- name: Install build essentials (Ubuntu)
  become: true
  ansible.builtin.apt:
    name:
      - build-essential
      - gcc
      - g++
      - make
      - cmake
      - automake
      - autoconf
      - libssl-dev
      - pkg-config
      - unzip
      - curl
      - wget
      - xz-utils
      - tar
      - bzip2
      - software-properties-common
      - apt-transport-https
      - ca-certificates
      - gnupg
    state: present
  when: ansible_os_family == "Debian"