---
- name: Download Google Cloud CLI (ARM64)
  ansible.builtin.unarchive:
    src: https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-linux-arm.tar.gz
    dest: "{{ target_user_home }}/.local/share/"
    remote_src: true
    creates: "{{ target_user_home }}/.local/share/google-cloud-sdk"

- name: Install gcloud CLI
  ansible.builtin.command:
    cmd: "{{ target_user_home }}/.local/share/google-cloud-sdk/install.sh --quiet --path-update false --command-completion false"
  args:
    creates: "{{ target_user_home }}/.local/share/google-cloud-sdk/bin/gcloud"
