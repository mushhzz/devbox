---
- name: Download AWS CLI v2
  ansible.builtin.get_url:
    url: >-
      {% if ansible_os_family == 'Darwin' -%}
        {% if ansible_architecture == 'arm64' -%}
          https://awscli.amazonaws.com/AWSCLIV2.pkg
        {%- else -%}
          https://awscli.amazonaws.com/AWSCLIV2.pkg
        {%- endif -%}
      {% else -%}
        {% if ansible_architecture == 'aarch64' -%}
          https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip
        {%- else -%}
          https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        {%- endif -%}
      {% endif %}
    dest: >-
      {% if ansible_os_family == 'Darwin' -%}
        /tmp/AWSCLIV2.pkg
      {%- else -%}
        /tmp/awscliv2.zip
      {%- endif %}
    mode: "0644"
  when: not ansible_check_mode

- name: Install AWS CLI (macOS)
  become: true
  ansible.builtin.command: installer -pkg /tmp/AWSCLIV2.pkg -target /
  args:
    creates: /usr/local/bin/aws
  when: ansible_os_family == "Darwin" and not ansible_check_mode

- name: Unarchive AWS CLI (Linux)
  ansible.builtin.unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp/
    remote_src: true
  when: ansible_os_family != "Darwin" and not ansible_check_mode

- name: Install AWS CLI (Linux)
  become: true
  ansible.builtin.command:
    cmd: /tmp/aws/install --install-dir /usr/local/aws-cli --bin-dir /usr/local/bin --update
  args:
    creates: /usr/local/bin/aws
  when: ansible_os_family != "Darwin" and not ansible_check_mode

- name: Clean up AWS CLI installer
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/awscliv2.zip
    - /tmp/AWSCLIV2.pkg
    - /tmp/aws