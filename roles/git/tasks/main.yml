---
# --- macOS ---
- name: Install git and GitHub CLI (macOS)
  become: false
  community.general.homebrew:
    name:
      - git
      - gh
    state: present
  when: ansible_os_family == "Darwin"

# --- Fedora ---
- name: Install git and GitHub CLI (Fedora)
  become: true
  ansible.builtin.dnf:
    name:
      - git
      - gh
    state: present
  when: ansible_os_family == "RedHat"

# --- Ubuntu/Debian ---
- name: Add GitHub CLI apt repo key
  become: true
  ansible.builtin.shell: >
    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg
    | tee /usr/share/keyrings/githubcli-archive-keyring.gpg >/dev/null
  args:
    creates: /usr/share/keyrings/githubcli-archive-keyring.gpg
  when: ansible_os_family == "Debian"

- name: Add GitHub CLI apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    filename: github-cli
    state: present
  when: ansible_os_family == "Debian"

- name: Install git and GitHub CLI (Ubuntu)
  become: true
  ansible.builtin.apt:
    name:
      - git
      - gh
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

# --- Common ---
- name: Deploy .gitconfig
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ target_user_home }}/.gitconfig"
    mode: "0644"
    backup: true

- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "{{ target_user_home }}/.ssh"
    state: directory
    mode: "0700"

- name: Generate SSH key
  ansible.builtin.command:
    cmd: >
      ssh-keygen -t {{ ssh_key_type }} -C "{{ ssh_key_comment }}"
      -f {{ target_user_home }}/.ssh/id_{{ ssh_key_type }} -N ""
  args:
    creates: "{{ target_user_home }}/.ssh/id_{{ ssh_key_type }}"

- name: Read SSH public key
  ansible.builtin.slurp:
    src: "{{ target_user_home }}/.ssh/id_{{ ssh_key_type }}.pub"
  register: ssh_pub_key

- name: Display SSH public key
  ansible.builtin.debug:
    msg: |
      === Add this SSH key to GitHub (https://github.com/settings/keys) ===
      {{ ssh_pub_key.content | b64decode }}